[workspace]
resolver = "2"
members = ["contracts/primary"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Orinex-Soroban/orinex-core"

[workspace.dependencies]
soroban-sdk = "30.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
